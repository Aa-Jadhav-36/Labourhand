spring:
  datasource:
    url: jdbc:mysql://localhost:3306/labourhand_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update        # Safely updates schema on startup; NEVER drops tables or deletes data
    open-in-view: false
    show-sql: false
    defer-datasource-initialization: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        globally_quoted_identifiers: false

  sql:
    init:
      mode: never              # Do NOT re-run schema.sql / data.sql on startup (data already in DB)

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration: 604800000 # 7 days in milliseconds

server:
  port: 8081

logging:
  level:
    com.labourhand: DEBUG
    org.springframework.security: TRACE
