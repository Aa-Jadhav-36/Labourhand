<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In - LabourHand</title>
  <meta name="description" content="Sign in to your LabourHand account to find jobs or manage your projects." />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<div class="lh-auth-bg">
  <div class="lh-auth-card">

    <!-- Back -->
    <a href="index.html" class="btn btn-sm btn-outline-secondary mb-3">&larr; Back</a>

    <div class="lh-card p-4 p-md-5">
      <!-- Logo -->
      <div class="text-center mb-4">
        <div class="lh-logo-circle">🔨</div>
        <h1 class="h4 fw-bold mb-1">Welcome Back</h1>
        <p class="text-muted small">Sign in to continue to LabourHand</p>
      </div>

      <!-- Role tabs -->
      <div class="lh-role-tabs mb-4">
        <button class="lh-role-tab active" id="tab-worker" onclick="setRole('worker')">Worker</button>
        <button class="lh-role-tab"        id="tab-owner"  onclick="setRole('owner')">Employer</button>
      </div>

      <!-- Error alert -->
      <div id="error-box" class="alert alert-danger d-none py-2 small"></div>

      <!-- Form -->
      <form id="login-form" novalidate>
        <div class="mb-3">
          <label class="form-label fw-medium" for="email">Email or Phone</label>
          <div class="lh-input-wrap">
            <span class="lh-input-icon">✉️</span>
            <input id="email" type="text" class="form-control" placeholder="Enter your email or phone" required />
          </div>
        </div>

        <div class="mb-2">
          <label class="form-label fw-medium" for="password">Password</label>
          <div class="lh-input-wrap">
            <span class="lh-input-icon">🔒</span>
            <input id="password" type="password" class="form-control has-right-icon" placeholder="Enter your password" required />
            <button type="button" class="lh-input-icon-right" id="toggle-pw" onclick="togglePw()">👁</button>
          </div>
        </div>

        <div class="text-end mb-3">
          <button type="button" class="btn btn-link btn-sm p-0 text-decoration-none" style="color:var(--lh-primary)" id="forgot-link">Forgot password?</button>
        </div>

        <button type="submit" class="btn w-100 fw-semibold py-2" style="background:var(--lh-primary);color:#fff;" id="submit-btn">
          <span id="btn-text">Sign In</span>
          <span id="btn-spinner" class="spinner-border spinner-border-sm d-none ms-2" role="status"></span>
        </button>
      </form>

      <!-- Demo credentials -->
      <div class="mt-4 p-3 rounded-3" style="background:#eff6ff;border:1px solid #bfdbfe;">
        <p class="mb-1 fw-semibold small" style="color:#1e40af;">Demo Credentials:</p>
        <p class="mb-0 small" style="color:#1d4ed8;">
          Worker: <code>rajesh@labourhand.com / worker123</code><br>
          Owner: <code>priya@labourhand.com / owner123</code>
        </p>
      </div>

      <!-- Sign up link -->
      <p class="text-center text-muted small mt-4">
        Don't have an account?
        <a id="register-link" href="register.html" style="color:var(--lh-primary);" class="fw-semibold text-decoration-none">Sign Up</a>
      </p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/session.js"></script>
<script src="js/router.js"></script>
<script src="js/apiService.js"></script>
<script src="js/mockTest.js"></script>
<script>
  Router.redirectIfLoggedIn();

  let currentRole = new URLSearchParams(location.search).get('role') || 'worker';
  setRole(currentRole);

  function setRole(role) {
    currentRole = role;
    document.getElementById('tab-worker').classList.toggle('active', role === 'worker');
    document.getElementById('tab-owner').classList.toggle('active',  role === 'owner');
    document.getElementById('register-link').href = `register.html?role=${role}`;
  }

  function togglePw() {
    const pw = document.getElementById('password');
    pw.type = pw.type === 'password' ? 'text' : 'password';
  }

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const errBox   = document.getElementById('error-box');
    const spinner  = document.getElementById('btn-spinner');
    const btnText  = document.getElementById('btn-text');
    const btn      = document.getElementById('submit-btn');

    errBox.classList.add('d-none');
    spinner.classList.remove('d-none');
    btnText.textContent = 'Signing in…';
    btn.disabled = true;

    try {
      const { token, user } = await Api.auth.login(email, password);
      SessionManager.createSession({
        id:            String(user.id),
        name:          user.name,
        email:         user.email,
        phone:         user.phone,
        role:          user.role === 'WORKER' ? 'worker' : 'owner',
        avatar:        user.avatar,
        verified:      user.verified,
        language:      user.language || 'en',
        skills:        user.skills,
        rating:        user.rating,
        completedJobs: user.completedJobs,
        companyName:   user.companyName,
        projectsPosted: user.projectsPosted,
      }, token);

      const redirect = new URLSearchParams(location.search).get('redirect');
      if (redirect) { location.href = redirect; }
      else if (user.role === 'WORKER') { location.href = 'dashboard.html'; }
      else { location.href = 'contractor.html'; }

    } catch (err) {
      errBox.textContent = 'Invalid email or password. Please try again.';
      errBox.classList.remove('d-none');
    } finally {
      spinner.classList.add('d-none');
      btnText.textContent = 'Sign In';
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
