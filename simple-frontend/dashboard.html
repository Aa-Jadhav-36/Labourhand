<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - LabourHand</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<!-- ── Top Header ──────────────────────────────────────────────────────── -->
<header class="bg-white border-bottom sticky-top" style="z-index:200;">
  <div class="d-flex align-items-center justify-content-between px-3 py-2" style="max-width:1100px;margin:auto;">
    <!-- Avatar + name -->
    <div class="d-flex align-items-center gap-3">
      <img id="hdr-avatar" src="https://ui-avatars.com/api/?name=U&background=f97316&color=fff&size=48"
           class="rounded-circle border" style="width:46px;height:46px;object-fit:cover;" alt="avatar" />
      <div>
        <div class="d-flex align-items-center gap-2">
          <h6 class="mb-0 fw-bold" id="hdr-name">—</h6>
          <span class="lh-verified" id="hdr-verified">✔ Verified</span>
        </div>
        <small class="text-muted" id="hdr-role">—</small>
      </div>
    </div>
    <!-- Language toggle -->
    <div class="d-flex align-items-center gap-2">
      <button class="btn btn-sm btn-outline-secondary" id="lang-btn" onclick="toggleLanguage()">हिंदी</button>
      <button class="btn btn-sm btn-outline-danger" onclick="Router.logout()">Logout</button>
    </div>
  </div>

  <!-- Mode toggle removed -->
</header>

<!-- ── Layout wrapper ───────────────────────────────────────────────────── -->
<div class="d-md-flex" style="max-width:1100px;margin:auto;">

  <!-- Sidebar (desktop) -->
  <aside class="lh-sidebar">
    <a href="dashboard.html"   class="lh-sidebar-link active">🏠 Dashboard</a>
    <a href="my-bids.html"     class="lh-sidebar-link">📋 My Bids</a>
    <a href="messages.html"    class="lh-sidebar-link">💬 Messages</a>
    <a href="worker-profile.html" class="lh-sidebar-link" id="sidebar-profile">👤 My Profile</a>
    <hr/>
    <button class="lh-sidebar-link border-0 w-100 text-start" onclick="Router.logout()">🚪 Logout</button>
  </aside>

  <!-- Main content -->
  <main class="flex-grow-1 p-3 p-md-4 lh-page-body">

    <!-- Nearby Opportunities Map -->
    <section class="mb-4">
      <div class="d-flex justify-content-between align-items-center mb-2 flex-wrap gap-2">
        <h5 class="lh-section-title mb-0" data-en="Nearby Opportunities" data-hi="पास के अवसर">Nearby Opportunities</h5>
        
        <div class="d-flex align-items-center gap-2 mb-1">
          <div class="input-group input-group-sm">
            <input type="text" id="loc-input" class="form-control" placeholder="Search city..." style="max-width:150px;" />
            <button class="btn btn-outline-secondary" onclick="fetchCustomLocation()">🔍</button>
            <button class="btn btn-outline-primary" onclick="geolocateUser()" title="Use My Location">📍</button>
          </div>
          <small class="text-muted fw-medium ms-2">Radius:</small>
          <input type="range" id="radius-slider" min="1" max="50" value="10" class="form-range" style="width:100px;accent-color:var(--lh-primary);" />
          <small class="text-muted" id="radius-label" style="min-width:40px;">10 km</small>
        </div>
      </div>
      <div class="lh-card overflow-hidden">
        <div id="map"></div>
      </div>
    </section>

    <!-- Jobs near you -->
    <section class="mb-4">
      <h5 class="lh-section-title" data-en="Jobs Near You" data-hi="आपके पास नौकरियाँ">Jobs Near You</h5>
      <div id="jobs-list">
        <!-- JS-rendered -->
      </div>
    </section>

    <!-- Browse by Category -->
    <section class="mb-4">
      <h5 class="lh-section-title" data-en="Browse by Category" data-hi="श्रेणी के अनुसार ब्राउज़ करें">Browse by Category</h5>
      <div class="d-flex gap-3 overflow-x-auto pb-2" id="category-row">
        <!-- JS-rendered -->
      </div>
    </section>

    <!-- Owner Quick Actions (hidden for workers) -->
    <section class="mb-4" id="owner-actions" style="display:none!important;">
      <h5 class="lh-section-title" data-en="Quick Actions" data-hi="त्वरित क्रियाएँ">Quick Actions</h5>
      <div class="row g-3">
        <div class="col-12">
          <div class="lh-card p-3">
            <a href="contractor.html" class="btn w-100 fw-semibold py-3" style="background:var(--lh-primary);color:#fff;">
              + Post a New Job
            </a>
          </div>
        </div>
        <div class="col-12">
          <div class="lh-card p-3 lh-card-clickable" onclick="location.href='contractor.html'">
            <div class="d-flex justify-content-between align-items-center">
              <div>
                <h6 class="mb-0 fw-bold">Manage Team</h6>
                <small class="text-muted" id="team-count">5 workers available</small>
              </div>
              <span class="fs-4">👥</span>
            </div>
          </div>
        </div>
      </div>
    </section>

  </main>
</div>

<!-- FAB (owner mode) -->
<button class="lh-fab d-none" id="fab-btn" onclick="location.href='contractor.html'">+</button>

<!-- Bottom nav (mobile) -->
<nav class="lh-bottom-nav d-md-none">
  <a href="dashboard.html" class="active">🏠<span>Home</span></a>
  <a href="my-bids.html">📋<span>My Bids</span></a>
  <a href="messages.html">💬<span>Messages</span></a>
  <a href="worker-profile.html" id="bottom-profile">👤<span>Profile</span></a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/session.js"></script>
<script src="js/router.js"></script>
<script src="js/notify.js"></script>
<script src="js/apiService.js"></script>
<script src="js/dataMapper.js"></script>
<script src="js/mockTest.js"></script>
<script>
  Router.requireAuth();

  const user = SessionManager.getCurrentUser();
  const isOwner = user?.role === 'owner';

  SessionManager.initCommonUI();

  /* ── Leaflet map ───────────────────────────────────── */
  let CENTER = [12.9716, 77.5946];
  try {
      const saved = localStorage.getItem('lh_user_loc');
      if (saved) CENTER = JSON.parse(saved);
  } catch(e) {}
  const map = L.map('map').setView(CENTER, 12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
  }).addTo(map);



  let markers = [];
  let radiusCircle = null;

  function updateRadiusCircle() {
    if (radiusCircle) radiusCircle.remove();
    radiusCircle = L.circle(CENTER, {
      radius: radius * 1000,
      color: 'var(--lh-primary)',
      fillColor: 'var(--lh-primary)',
      fillOpacity: 0.06,
      weight: 2,
      dashArray: '6 4'
    }).addTo(map);
  }

  function updateMarkers(projects) {
    markers.forEach(m => m.remove());
    markers = [];
    projects.forEach(p => {
      if (p.lat && p.lng) {
        
        let emoji = '📍';
        let style = 'border: 2px solid gray; background: #fff;';
        
        if (p.status === 'OPEN_FOR_BIDS') {
           emoji = '📢'; // Open for workers
           style = 'border: 2px solid #16a34a; background: #dcfce7;'; // Green for grab!
        } else if (p.status === 'IN_PROGRESS') {
           if (isOwner && p.ownerId === user?.id) {
               emoji = '🏗️'; // Employer's active job
               style = 'border: 2px solid #f97316; background: #ffedd5; text-shadow: 0px 0px 4px orange;';
           } else {
               emoji = '🚧'; // general WIP or someone else's job
               style = 'border: 2px solid #64748b; background: #f1f5f9;';
           }
        } else if (p.status === 'COMPLETED') {
           emoji = '✅';
           style = 'border: 2px solid #3b82f6; background: #eff6ff;';
        }

        const iconHtml = `<div style="font-size:18px; text-align:center; border-radius:50%; width:34px; height:34px; line-height:30px; box-shadow: 0 3px 6px rgba(0,0,0,0.3); ${style}">${emoji}</div>`;
        const customIcon = L.divIcon({ html: iconHtml, className: '', iconSize: [34, 34], iconAnchor: [17, 17] });

        const m = L.marker([p.lat, p.lng], { icon: customIcon })
          .addTo(map)
          .bindPopup(`<b>${p.title}</b><br>${p.location}<br>₹${p.budget}<br><div class="mt-1">${DataMapper.statusBadge(p.status)}</div>`);
        markers.push(m);
      }
    });
  }

  /* ── Job card template ─────────────────────────────── */
  function jobCard(job) {
    const dist = job.distanceKm != null ? job.distanceKm.toFixed(1) : '?';
    return `
      <div class="lh-card lh-card-clickable p-3 mb-3" onclick="location.href='project.html?id=${job.id}'">
        <div class="d-flex justify-content-between align-items-start mb-2">
          <h6 class="mb-0 fw-bold flex-grow-1 me-2">${job.title}</h6>
          ${DataMapper.statusBadge(job.status)}
        </div>
        <div class="text-muted small mb-3">📍 ${job.location}</div>
        <div class="d-flex justify-content-between align-items-center">
          <span class="badge fw-semibold fs-6 px-3 py-1" style="background:var(--lh-primary);">${DataMapper.currency(job.budget)}</span>
          <span class="badge bg-light text-secondary border fw-semibold">📍 ${dist} km away</span>
        </div>
      </div>`;
  }

  /* ── Load projects ─────────────────────────────────── */
  let radius = 10;
  async function loadProjects() {
    DataMapper.showSpinner('#jobs-list');
    updateRadiusCircle();
    try {
      const projects = await Api.project.getNearby(CENTER[0], CENTER[1], radius);
      DataMapper.toCards('#jobs-list', projects, jobCard);
      updateMarkers(projects);
    } catch (err) {
      DataMapper.showError('#jobs-list', `Failed to load jobs: ${err.message}`);
    }
  }

  /* ── Radius slider ─────────────────────────────────── */
  const slider = document.getElementById('radius-slider');
  const radiusLabel = document.getElementById('radius-label');
  slider.addEventListener('input', () => {
    radius = Number(slider.value);
    radiusLabel.textContent = `${radius} km`;
    updateRadiusCircle();
  });
  let sliderTimer;
  slider.addEventListener('change', () => {
    clearTimeout(sliderTimer);
    sliderTimer = setTimeout(loadProjects, 200);
  });

  /* ── Location Fetch ────────────────────────────────── */
  function geolocateUser(silent = false) {
    if (!navigator.geolocation) {
      if (!silent) Notify.error('Geolocation is not supported by your browser');
      return;
    }
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const newCenter = [pos.coords.latitude, pos.coords.longitude];
        // Only reload if location actually changed significantly, or if user explicitly requested it
        const changed = Math.abs(CENTER[0] - newCenter[0]) > 0.001 || Math.abs(CENTER[1] - newCenter[1]) > 0.001;
        
        CENTER = newCenter;
        localStorage.setItem('lh_user_loc', JSON.stringify(CENTER));
        
        if (!silent) {
          map.setView(CENTER, 12);
          document.getElementById('loc-input').value = "My Location";
          loadProjects();
        } else if (changed) {
          // In silent background mode, only reload data if the location changed enough to affect distances
          loadProjects();
        }
      },
      (err) => {
        if (!silent) Notify.error(`Could not fetch location: ${err.message}`);
      }
    );
  }

  async function fetchCustomLocation() {
    const q = document.getElementById('loc-input').value.trim();
    if (!q) return geolocateUser();
    try {
      const resp = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}`);
      const data = await resp.json();
      if (!data || !data.length) return Notify.error('Location not found');
      CENTER = [parseFloat(data[0].lat), parseFloat(data[0].lon)];
      localStorage.setItem('lh_user_loc', JSON.stringify(CENTER));
      map.setView(CENTER, 12);
      loadProjects();
    } catch(err) {
      Notify.error('Error fetching location from Nominatim');
    }
  }

  /* ── Job categories ────────────────────────────────── */
  const categories = [
    { icon:'📋', name:'All',          color:'#f1f5f9', cat:'' },
    { icon:'🔨', name:'Construction', color:'#fff7ed', cat:'CONSTRUCTION' },
    { icon:'💧', name:'Plumbing',     color:'#eff6ff', cat:'PLUMBING' },
    { icon:'⚡', name:'Electrical',   color:'#fefce8', cat:'ELECTRICAL' },
    { icon:'🎨', name:'Painting',     color:'#faf5ff', cat:'PAINTING' },
    { icon:'🪚', name:'Carpentry',    color:'#f0fdf4', cat:'CARPENTRY' },
    { icon:'🧱', name:'Masonry',      color:'#fff1f2', cat:'MASONRY' },
  ];
  document.getElementById('category-row').innerHTML = categories.map(c => `
    <div class="lh-category-pill" onclick="filterByCategory('${c.cat}')">
      <div class="lh-cat-icon" style="background:${c.color};">${c.icon}</div>
      <span>${c.name}</span>
    </div>`).join('');

  async function filterByCategory(cat) {
    // Reset active state on pills
    document.querySelectorAll('.lh-category-pill').forEach(el => el.classList.remove('active'));
    event?.currentTarget?.classList.add('active');

    if (!cat) return loadProjects();
    DataMapper.showSpinner('#jobs-list');
    try {
      // Use location-aware + category combined endpoint
      const projects = await Api.project.getNearbyByCategory(CENTER[0], CENTER[1], radius, cat);
      DataMapper.toCards('#jobs-list', projects, jobCard);
      updateMarkers(projects);
    } catch (err) {
      DataMapper.showError('#jobs-list', `Failed: ${err.message}`);
    }
  }

  // Initial load
  loadProjects();
  
  // Try to get accurate location silently on startup
  geolocateUser(true);
  
  // Auto-refresh location and distances every 10 minutes (600,000 ms)
  setInterval(() => geolocateUser(true), 600000);
</script>
</body>
</html>
